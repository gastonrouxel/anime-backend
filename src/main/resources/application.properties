# ── Base de données ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:AniVault}?sslMode=VERIFY_IDENTITY
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA ───────────────────────────────────────────────────────────────────────
# validate = vérifie que les entités correspondent aux tables (ne modifie rien)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ── Serveur ───────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8080}

# ── Logs ──────────────────────────────────────────────────────────────────────
logging.level.com.Animes=INFO
